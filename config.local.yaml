server:
  host: "0.0.0.0"
  port: 8080
  external_url: "http://localhost:8080"
  rate_limit: 1000

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "rabby_pg_pass"
  dbname: "hostctl"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 300

redis:
  host: "localhost"
  port: 6379

auth:
  jwt_secret: "local-dev-secret-key-32-chars-min!!"
  jwt_duration: 24

storage:
  backend: "local"
  local_path: "/tmp/hostctl-storage"

logging:
  level: "debug"
  format: "text"
  output: "stdout"
