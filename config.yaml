# Hostctl Configuration
server:
  host: "0.0.0.0"
  port: 8080
  external_url: "https://panel.hostctl.io"
  read_timeout: 30
  write_timeout: 60
  rate_limit: 100
  cors_origins:
    - "*"

database:
  host: "localhost"
  port: 5432
  user: "hostctl"
  password: "change-me"
  dbname: "hostctl"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 300

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

auth:
  jwt_secret: "change-me-in-production-64-char-min"
  jwt_duration: 24
  refresh_token_ttl: 720
  mfa_issuer: "Hostctl"
  session_timeout: 3600
  max_login_attempts: 5
  login_lockout_minutes: 15
  password_policy:
    min_length: 12
    require_upper: true
    require_lower: true
    require_number: true
    require_special: true
  oauth_providers:
    - name: "google"
      client_id: ""
      secret: ""
      issuer: "https://accounts.google.com"

agent:
  grpc_port: 9000
  heartbeat_interval: 30
  mtls_cert_file: ""
  mtls_key_file: ""
  ca_cert_file: ""

storage:
  backend: "s3"
  endpoint: "http://localhost:9000"
  region: "us-east-1"
  bucket: "hostctl-backups"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  encrypt_key: ""

billing:
  provider: "stripe"
  api_key: ""
  webhook_secret: ""
  default_currency: "USD"
  tax_rate: 0.0

monitoring:
  metrics_retention_days: 90
  prometheus_endpoint: "http://localhost:9090"
  grafana_url: "http://localhost:3000"

logging:
  level: "info"
  format: "json"
  output: "stdout"

email:
  smtp_host: "localhost"
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  from_address: "noreply@hostctl.io"
  from_name: "Hostctl Panel"

dns:
  provider: "bind"
  default_ttl: 300
  nameservers:
    - "ns1.hostctl.io"
    - "ns2.hostctl.io"

jobs:
  max_concurrent: 10
  default_timeout: 300
  max_retries: 3
  queue_driver: "redis"
